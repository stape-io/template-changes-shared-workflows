on:
  workflow_call:
    outputs:
      topic_id:
        value: ${{ jobs.bootstrap.outputs.topic_id }}
      post_id:
        value: ${{ jobs.bootstrap.outputs.post_id }}

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      topic_id: ${{ steps.resolve.outputs.topic_id }}
      post_id: ${{ steps.resolve.outputs.post_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Check community config file
        id: check
        run: |
          set -euo pipefail
          CONFIG_PATH=".github/community-config.json"

          if [ -f "$CONFIG_PATH" ] && jq -e . "$CONFIG_PATH" >/dev/null 2>&1; then
            TOPIC_ID=$(jq -r '.COMMUNITY_TOPIC_ID // empty' "$CONFIG_PATH")
            POST_ID=$(jq -r '.COMMUNITY_POST_ID // empty' "$CONFIG_PATH")
          else
            TOPIC_ID=""
            POST_ID=""
          fi

          if [[ "$TOPIC_ID" =~ ^[0-9]+$ ]] && [[ "$POST_ID" =~ ^[0-9]+$ ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "topic_id=$TOPIC_ID" >> "$GITHUB_OUTPUT"
            echo "post_id=$POST_ID" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Discourse topic
        id: create
        if: steps.check.outputs.ready == 'false'
        env:
          API_KEY: ${{ secrets.COMMUNITY_API_KEY }}
          API_USERNAME: ${{ secrets.COMMUNITY_API_USERNAME }}
          CATEGORY_ID: ${{ vars.COMMUNITY_CATEGORY_ID }}
        run: |
          set -euo pipefail
          TITLE=$(awk '/^# /{print substr($0, 3); exit}' README.md)
          BODY=$(awk '
            /^# / && !found { found=1; next }
            found && /^[[:space:]]*$/ && !started { next }
            found { started=1; print }
          ' README.md)

          REPO_URL="${{ github.event.repository.html_url }}"
          GITHUB_LINE="### GitHub
          🟢 [Repository](${REPO_URL})"
          BODY="${BODY}"$'\n\n'"${GITHUB_LINE}"

          if [ ${#TITLE} -gt 70 ]; then
            TITLE="${TITLE:0:69}…"
          fi

          RESPONSE=$(curl -s \
            -X POST "https://community.stape.io/posts.json" \
            -H "Content-Type: application/json" \
            -H "Api-Key: ${API_KEY}" \
            -H "Api-Username: ${API_USERNAME}" \
            -H "User-Agent: curl/8.4.0" \
            --data-raw "$(jq -n \
              --arg title "$TITLE" \
              --arg raw "$BODY" \
              --argjson category "$CATEGORY_ID" \
              '{title: $title, raw: $raw, category: $category}')")

          TOPIC_ID=$(echo "$RESPONSE" | jq -r '.topic_id')
          if ! [[ "$TOPIC_ID" =~ ^[0-9]+$ ]]; then
            echo "Failed to create Discourse topic. Response:"
            echo "$RESPONSE"
            exit 1
          fi

          POST_ID=$(curl -s \
            "https://community.stape.io/t/${TOPIC_ID}.json" \
            -H "Api-Key: ${API_KEY}" \
            -H "Api-Username: ${API_USERNAME}" \
            -H "User-Agent: curl/8.4.0" \
            | jq -r '.post_stream.posts[0].id')
          if ! [[ "$POST_ID" =~ ^[0-9]+$ ]]; then
            echo "Failed to fetch post ID for topic ${TOPIC_ID}"
            exit 1
          fi

          echo "topic_id=$TOPIC_ID" >> "$GITHUB_OUTPUT"
          echo "post_id=$POST_ID" >> "$GITHUB_OUTPUT"

      - name: Save IDs to community config file
        if: steps.check.outputs.ready == 'false'
        run: |
          set -euo pipefail
          CONFIG_PATH=".github/community-config.json"
          mkdir -p .github

          jq -n \
            --argjson topic "${{ steps.create.outputs.topic_id }}" \
            --argjson post "${{ steps.create.outputs.post_id }}" \
            '{COMMUNITY_TOPIC_ID: $topic, COMMUNITY_POST_ID: $post}' > "$CONFIG_PATH"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -z "$(git status --porcelain -- "$CONFIG_PATH")" ]; then
            echo "community-config.json already up to date"
            exit 0
          fi

          git add "$CONFIG_PATH"
          git commit -m "chore: upsert community config"
          # Retry push with rebase to handle concurrent updates to main
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break
            echo "Push rejected, retrying ($i)..."
            sleep $((RANDOM % 5 + 1))
          done

      - name: Resolve IDs
        id: resolve
        run: |
          if [ "${{ steps.check.outputs.ready }}" = "true" ]; then
            TOPIC_ID="${{ steps.check.outputs.topic_id }}"
            POST_ID="${{ steps.check.outputs.post_id }}"
            echo "Already bootstrapped: topic_id=$TOPIC_ID, post_id=$POST_ID"
          else
            TOPIC_ID="${{ steps.create.outputs.topic_id }}"
            POST_ID="${{ steps.create.outputs.post_id }}"
            echo "Newly bootstrapped: topic_id=$TOPIC_ID, post_id=$POST_ID"
          fi
          echo "topic_id=$TOPIC_ID" >> "$GITHUB_OUTPUT"
          echo "post_id=$POST_ID" >> "$GITHUB_OUTPUT"
