on:
  workflow_call:
    inputs:
      post_id:
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Parse README body
        id: readme
        run: |
          BODY=$(awk '
            /^# / && !found { found=1; next }
            found && /^[[:space:]]*$/ && !body_started { next }
            found { body_started=1; print }
          ' README.md)

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check GTM gallery status
        id: gallery
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://tagmanager.google.com/api/gallery/owners/stape-io/templates/${{ github.event.repository.name }}")
          if [ "$STATUS" = "200" ]; then
            echo "listed=true" >> $GITHUB_OUTPUT
          else
            echo "listed=false" >> $GITHUB_OUTPUT
          fi
          echo "Gallery listed: $([ "$STATUS" = "200" ] && echo true || echo false)"

      - name: Update Discourse post
        env:
          POST_ID: ${{ inputs.post_id }}
          API_KEY: ${{ secrets.COMMUNITY_API_KEY }}
          API_USERNAME: ${{ secrets.COMMUNITY_API_USERNAME }}
          BODY: ${{ steps.readme.outputs.body }}
          GALLERY_LISTED: ${{ steps.gallery.outputs.listed }}
        run: |
          REPO_URL="${{ github.event.repository.html_url }}"
          REPO_NAME="${{ github.event.repository.name }}"

          if [ "$GALLERY_LISTED" = "true" ]; then
            GALLERY_LINE=$(cat <<EOF
          ### GTM Gallery Status
          🟢 [Listed](https://tagmanager.google.com/gallery/#/owners/stape-io/templates/${REPO_NAME})
          EOF
            )
          else
            GALLERY_LINE=$(cat <<EOF
          ### GTM Gallery Status
          🔴 Not listed
          EOF
            )
          fi

          GITHUB_LINE="### GitHub
          🟢 [Repository](${REPO_URL})"

          FULL_BODY="$(printf '%s\n\n%s\n\n%s' "$BODY" "$GITHUB_LINE" "$GALLERY_LINE")"

          echo "Updating Discourse post ${POST_ID}"

          STATUS=$(curl -s -o /tmp/discourse_response.json -w "%{http_code}" \
            -X PUT "https://community.stape.io/posts/${POST_ID}.json" \
            -H "Content-Type: application/json" \
            -H "Api-Key: ${API_KEY}" \
            -H "Api-Username: ${API_USERNAME}" \
            --data-raw "$(jq -n --arg raw "$FULL_BODY" '{post: {raw: $raw}}')")

          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            cat /tmp/discourse_response.json
            echo "Failed to update post"
            exit 1
          fi
