on:
  workflow_call:
    inputs:
      post_id:
        required: true
        type: string

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Parse README body
        id: readme
        run: |
          BODY=$(awk '
            /^# / && !found { found=1; next }
            found && /^[[:space:]]*$/ && !body_started { next }
            found { body_started=1; print }
          ' README.md)

          echo "body<<EOF" >> $GITHUB_OUTPUT
          echo "$BODY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Check GTM gallery status
        id: gallery
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://tagmanager.google.com/api/gallery/owners/stape-io/templates/${{ github.event.repository.name }}")
          if [ "$STATUS" = "200" ]; then
            echo "listed=true" >> $GITHUB_OUTPUT
          else
            echo "listed=false" >> $GITHUB_OUTPUT
          fi
          echo "Gallery listed: $([ "$STATUS" = "200" ] && echo true || echo false)"

      - name: Update Discourse post
        env:
          POST_ID: ${{ inputs.post_id }}
          API_KEY: ${{ secrets.COMMUNITY_API_KEY }}
          API_USERNAME: ${{ secrets.COMMUNITY_API_USERNAME }}
          BODY: ${{ steps.readme.outputs.body }}
          GALLERY_LISTED: ${{ steps.gallery.outputs.listed }}
        run: |
          TITLE=$(awk '/^# /{print substr($0, 3); exit}' README.md)
          if [ ${#TITLE} -gt 70 ]; then
            TITLE="${TITLE:0:69}…"
          fi

          TOPIC_ID=$(jq -r '.COMMUNITY_TOPIC_ID // empty' .github/community-config.json)
          if ! [[ "$TOPIC_ID" =~ ^[0-9]+$ ]]; then
            echo "Failed to read topic ID from .github/community-config.json"
            exit 1
          fi

          REPO_URL="${{ github.event.repository.html_url }}"
          REPO_NAME="${{ github.event.repository.name }}"

          if [ "$GALLERY_LISTED" = "true" ]; then
            GALLERY_STATUS_LINE="🟢 [Listed](https://tagmanager.google.com/gallery/#/owners/stape-io/templates/${REPO_NAME})"
          else
            GALLERY_STATUS_LINE="🔴 Not listed"
          fi

          GALLERY_LINE="### GTM Gallery Status
          ${GALLERY_STATUS_LINE}"

          GITHUB_LINE="### GitHub
          🟢 [Repository](${REPO_URL})"

          if printf '%s' "$BODY" | grep -q "^### GTM Gallery Status$"; then
            BODY=$(printf '%s' "$BODY" | awk -v status="$GALLERY_STATUS_LINE" '
              /^### GTM Gallery Status$/ { print; getline; print status; next }
              { print }
            ')
            FULL_BODY="$(printf '%s\n\n%s' "$BODY" "$GITHUB_LINE")"
          else
            FULL_BODY="$(printf '%s\n\n%s\n\n%s' "$BODY" "$GALLERY_LINE" "$GITHUB_LINE")"
          fi

          echo "Updating Discourse post ${POST_ID}"

          STATUS=$(curl -s -o /tmp/discourse_response.json -w "%{http_code}" \
            -X PUT "https://community.stape.io/posts/${POST_ID}.json" \
            -H "Content-Type: application/json" \
            -H "Api-Key: ${API_KEY}" \
            -H "Api-Username: ${API_USERNAME}" \
            --data-raw "$(jq -n --arg raw "$FULL_BODY" '{post: {raw: $raw}}')")

          echo "Response: $STATUS"
          if [ "$STATUS" != "200" ]; then
            cat /tmp/discourse_response.json
            echo "Failed to update post"
            exit 1
          fi

          echo "Updating Discourse topic title ${TOPIC_ID}"

          TITLE_STATUS=$(curl -s -o /tmp/discourse_title_response.json -w "%{http_code}" \
            -X PUT "https://community.stape.io/t/${TOPIC_ID}.json" \
            -H "Content-Type: application/json" \
            -H "Api-Key: ${API_KEY}" \
            -H "Api-Username: ${API_USERNAME}" \
            -H "User-Agent: curl/8.4.0" \
            --data-raw "$(jq -n --arg title "$TITLE" '{title: $title}')")

          echo "Title response: $TITLE_STATUS"
          if [ "$TITLE_STATUS" != "200" ]; then
            cat /tmp/discourse_title_response.json
            echo "Failed to update topic title"
            exit 1
          fi
