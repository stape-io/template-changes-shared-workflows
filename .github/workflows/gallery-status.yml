on:
  workflow_call:

jobs:
  gallery-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Determine current badge state in README
        id: current
        run: |
          if ! grep -q '^### GTM Gallery Status' README.md; then
            echo "state=missing" >> $GITHUB_OUTPUT
          elif awk '
              /^### GTM Gallery Status/ { in_block=1; next }
              in_block && /^(### |## |# )/ { in_block=0 }
              in_block
            ' README.md | grep -q '🟢'; then
            echo "state=listed" >> $GITHUB_OUTPUT
          else
            echo "state=not-listed" >> $GITHUB_OUTPUT
          fi

      - name: Check GTM gallery status
        id: gallery
        if: steps.current.outputs.state != 'listed'
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://tagmanager.google.com/api/gallery/owners/stape-io/templates/${{ github.event.repository.name }}")
          if [ "$STATUS" = "200" ]; then
            echo "listed=true" >> $GITHUB_OUTPUT
          else
            echo "listed=false" >> $GITHUB_OUTPUT
          fi

      - name: Determine desired badge state
        id: desired
        if: steps.current.outputs.state != 'listed'
        run: |
          if [ "${{ steps.gallery.outputs.listed }}" = "true" ]; then
            echo "state=listed" >> $GITHUB_OUTPUT
          else
            echo "state=not-listed" >> $GITHUB_OUTPUT
          fi

      - name: Log state decision
        if: steps.current.outputs.state != 'listed'
        run: |
          echo "Current badge state: ${{ steps.current.outputs.state }}"
          echo "Desired badge state: ${{ steps.desired.outputs.state }}"

      - name: Update README with gallery status
        if: steps.current.outputs.state != 'listed' && steps.current.outputs.state != steps.desired.outputs.state
        env:
          GALLERY_LISTED: ${{ steps.gallery.outputs.listed }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"

          if [ "$GALLERY_LISTED" = "true" ]; then
            GALLERY_LINE=$(cat <<EOF
          ### GTM Gallery Status
          🟢 [Listed](https://tagmanager.google.com/gallery/#/owners/stape-io/templates/${REPO_NAME})
          EOF
            )
          else
            GALLERY_LINE=$(cat <<EOF
          ### GTM Gallery Status
          🔴 Not listed
          EOF
            )
          fi

          # Remove existing gallery status block if present
          CLEANED=$(awk '
            /^### GTM Gallery Status/ { skip=1; next }
            skip && /^(### |## |# )/ { skip=0 }
            skip { next }
            { print }
          ' README.md)

          # Remove trailing blank lines
          CLEANED=$(echo "$CLEANED" | sed -e :a -e '/^\s*$/{ $d; N; ba; }')

          # Append new gallery status at the very bottom
          printf '%s\n\n%s\n' "$CLEANED" "$GALLERY_LINE" > README.md

      - name: Commit and push changes
        if: steps.current.outputs.state != 'listed' && steps.current.outputs.state != steps.desired.outputs.state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: update GTM Gallery status in README"
          # Retry push with rebase to handle concurrent updates to main
          for i in 1 2 3 4 5; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin HEAD:"${GITHUB_REF_NAME}" && break
            echo "Push rejected, retrying ($i)..."
            sleep $((RANDOM % 5 + 1))
          done
